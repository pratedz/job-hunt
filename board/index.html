<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>job hunt</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.7.4-1.2 1-1.2 1.8v.5"/><path d="M12 17.2v.1"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></symbol>
      <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12a20 20 0 0 0 18 0M10 13h4"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v7l-4 2v-9z"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-7 18-4-7-7-4 18-7ZM10 14 21 3"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 15v-4M13 15V7M18 15v-6"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10 5c5-1 9 4 11 7a20 20 0 0 1-3 4M6 6a21 21 0 0 0-5 6s4 7 11 7c2 0 4-1 5-2M10 10a3 3 0 0 0 4 4"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4m-2-2h4"/></symbol>
    </defs>
  </svg>
  <a class="skip-link" href="#list">Skip to jobs</a>
  <header class="top">
    <div class="top-row top-inner">
      <a class="brand" href="#" aria-label="Job hunt home"><span class="brand-mark" aria-hidden="true">jh<span>.</span></span><span>job hunt</span></a>
        <div class="search">
          <label for="q" class="visually-hidden" id="q-label">Search</label>
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false">
        </div>
      <nav class="primary-nav" aria-label="Main navigation">
        <button type="button" data-route="all"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span>Discover</span></button>
        <button type="button" data-route="to_apply"><svg class="i" aria-hidden="true"><use href="#i-briefcase"/></svg><span>Applications</span></button>
        <button type="button" data-route="lessons"><svg class="i" aria-hidden="true"><use href="#i-chart"/></svg><span>Insights</span></button>
        <button type="button" data-route="wiki" title="Career Wiki & AI setup"><svg class="i" aria-hidden="true"><use href="#i-book"/></svg><span>Wiki</span></button>
      </nav>
      <div class="header-tools">
        <button type="button" class="btn" id="add-job" aria-haspopup="dialog"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg><span>Add job</span></button>
        <button type="button" class="btn quiet icon" id="keys-btn" popovertarget="keys-pop" aria-label="Keyboard shortcuts" title="Keyboard shortcuts"><svg class="i" aria-hidden="true"><use href="#i-question"/></svg></button>
      </div>
    </div>
    <div class="keys-pop" id="keys-pop" popover></div>
  </header>

  <div class="layout">
    <aside class="navigation-rail" aria-label="Your workspace">
      <button type="button" class="profile profile-btn" id="profile-btn" title="Open Career Wiki & AI setup">
        <span class="avatar" id="profile-avatar" aria-hidden="true">JH</span>
        <span class="profile-meta">
          <span class="profile-name" id="profile-name">Career Wiki</span>
          <span class="profile-sub" id="profile-sub">Choose 1 AI · Setup</span>
        </span>
      </button>
      <nav class="tabs" id="tabs" aria-label="Job lists"></nav>
      <details class="sync-details"><summary><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg>Feed activity<svg class="i disclosure" aria-hidden="true"><use href="#i-chevron"/></svg></summary><p class="run" id="run" aria-live="polite"></p></details>
    </aside>
    <div class="main-col">
      <section class="setup-banner" id="setup-banner" aria-label="First-time setup" hidden></section>
      <section class="updates" id="updates" aria-labelledby="updates-title" hidden></section>
      <section class="notice" id="site-changes" aria-label="Careers pages changed" hidden></section>
      <main id="list" class="main" tabindex="-1">
      </main>
      <span class="mock-flag" id="mock-flag" hidden>Mock data</span>
    </div>
  </div>

  <dialog class="modal small" id="add-dialog" aria-labelledby="add-title"></dialog>
  <dialog class="modal small" id="sites-dialog" aria-labelledby="sites-title"></dialog>

  <dialog class="drawer" id="drawer" aria-labelledby="drawer-title"></dialog>
  <dialog class="modal" id="apply-result" aria-labelledby="apply-title"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
