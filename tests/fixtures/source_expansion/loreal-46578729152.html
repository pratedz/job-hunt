);'><strong>Platform and campaign management</strong></span></p><ul><li style='font-family: arial; color: rgb(0, 0, 0);'>Maintain effective working relationships with TikTok platform teams and follow up on opportunities to improve visibility, campaign participation, and conversion.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Coordinate campaign planning and execution with Marketing, O+O teams, the Affiliate Manager, and enabler partners.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Help ensure consistent brand presence and competitive activations across TikTok Shop.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Support the planning and delivery of promotions, content, and media activities to drive traffic and sales.</li></ul><p><br></p><p><span style='font-family: arial; color: rgb(0, 0, 0);'><strong>Performance and optimization</strong></span></p><ul><li style='font-family: arial; color: rgb(0, 0, 0);'>Prepare regular performance reviews, identify gaps and opportunities, and follow up on agreed actions.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Monitor the shopper journey and recommend improvements to content, shop design, traffic, and conversion.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Track onsite and offsite traffic performance and support data-backed promotional and media plans.</li></ul><p><br></p><p><span style='font-family: arial; color: rgb(0, 0, 0);'><strong>Cross-functional collaboration</strong></span></p><ul><li style='font-family: arial; color: rgb(0, 0, 0);'>Work with Marketing, Performance Marketing, Business Planning, Supply Chain, and external partners to deliver agreed business priorities.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Coordinate with Business Planning and e-Operations on sales forecasts and order fulfillment.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Escalate risks, issues, and decisions requiring broader alignment to the relevant stakeholders.</li></ul><p><br></p><p><span style='font-family: arial; color: rgb(0, 0, 0);'><strong>Qualifications</strong></span></p><ul><li style='font-family: arial; color: rgb(0, 0, 0);'>Bachelor’s degree or higher in Business, Marketing, E-Commerce, or a related field.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>At least 3 years of relevant E-Commerce experience; TikTok Shop experience in a brand, platform, or enabler environment is preferred.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Strong analytical and commercial skills, with the ability to turn data into clear recommendations.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Experience supporting platform growth, campaign execution, or high-velocity E-Commerce operations.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Organized, adaptable, and comfortable working in a fast-changing environment.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Able to coordinate projects from planning through execution and follow-up.</li><li style='font-family: arial; color: rgb(0, 0, 0);'>Collaborative, with strong communication skills in English and Thai at a business level.</li></ul><p><br></p><p><span style='font-family: arial; color: rgb(0, 0, 0);'><strong>Who we are</strong></span></p><p><span style='font-family: arial; color: rgb(0, 0, 0);'>Hello, we’re L’Oréal. For over a century, we’ve been dedicated to creating beauty that moves the world. With a presence in more than 150 countries and 37 international brands, we are a global leader in beauty. Our mission is to provide the best in beauty innovation to all women and men around the world, respecting their diversity.</span></p><p><span style='font-family: arial; color: rgb(0, 0, 0);'>We are committed to inclusive recruitment and to considering every candidate ethically and equitably. L’Oréal strictly prohibits discrimination against applicants on any basis protected by law.</span></p>","educationRequirements":"Bachelor",
