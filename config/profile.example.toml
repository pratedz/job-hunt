# Default template. Launch `python3 -m jobhunt board` to generate config/profile.toml
# from your Resume + Career Wiki Q&A, or copy this file to config/profile.toml manually.

[onboarding]
completed = false

[candidate]
name = "Your Name"
email = "you@example.com"
degree = "Bachelor's degree"
gpa = 0.0                       # Optional: set your confirmed GPA on a 4.0 scale (0.0 = unset)
graduation_year = 2027
degree_completed = false
fulltime_experience_years = 0   # Full-time corporate years (student clubs do not count)
languages = ["Thai", "English"]
test_scores = []                # e.g. ["IELTS 7.5", "TOEIC 850"]
nationality = "Thai"
based_in = "Bangkok, Thailand"


[gates.experience]
pass_max_years = 0              # 0 or not stated -> pass
ask_max_years = 1               # 1 year -> ask ("Do you consider fresh graduates?"); 2+ -> fail

[gates.gpa]

[gates.start]
available_th = "2027-06"        # Local roles
available_abroad = "2027-07"    # Roles needing relocation or visa sponsorship
immediate = "ask"
fixed_date_before_available = "fail"
late_start_after_months = 2     # Fixed start > 2 months after available month -> ask
late_start = "ask"
flexible = "pass"
unknown = "pass"

[gates.graduation]

[gates.degree]
completed_required = "fail"     # Set "pass" once your degree is already conferred

[gates.language]
have = ["Thai", "English"]
other_required = "fail"
test_score_required = "ask"

[gates.location]
pass_cities = ["Bangkok", "Nonthaburi", "Samut Prakan", "Pathum Thani"]
pass_countries = ["Singapore"]
remote = "pass"
unknown = "pass"
other = "ask"

[gates.job_type]
graduate_programme = "pass"
full_time = "pass"
unknown = "pass"
internship = "ask"
contract = "ask"
part_time = "fail"

[gates.other]
hard_requirements = "ask"

[paid]
anchors_thb_month = [25000, 35000, 45000, 55000]   # <25k=1 · 25-35k=2 · 35-45k=3 · 45-55k=4 · >=55k=5
sgd_to_thb = 25.0
usd_to_thb = 33.0
hkd_to_thb = 4.2

[prefilter]
title_exclude = [   # seniority: an include_override (trainee, graduate, junior ...) cancels these
  '\bsenior\b', '\bsr\.?\b', '\b(team|tech|technical|project|engineering) lead\b', '\bhead of\b', '\bdirector\b',
  '\bprincipal\b', '\bvice president\b', '\bvp\b', '\bchief\b',
  '\b(senior|general|country|regional|group|division|department|assistant general) manager\b',
  '\bcustomer service\b', '\bcall cent(er|re)\b', '\blive chat\b', '\bsecretary\b', '\baccountant\b', '\bcashier\b',
  '\breceptionist\b', '\badmin(istrative|istration)? (assistant|officer|staff|clerk)\b', '\bmessenger\b', '\bhousekeep\w*',
  '\bwait(er|ress)\b', '\bbarista\b', '\bsecurity guard\b', '\bloan\b', '\bpayroll\b',
]
title_exclude_hard = [   # off-track professions: always filtered, include_overrides do NOT cancel these
  '\bsoftware engineer\b', '\bdeveloper\b', '\bdevops\b', '\bdata (scientist|engineer)\b', '\bmachine learning\b',
  '\b(mechanical|electrical|civil|chemical|process|qa|test) engineer\b', '\bnurse\b', '\bpharmacist\b', '\bphysician\b',
  '\bdoctor\b', '\bchef\b', '\bdriver\b', '\btechnician\b', '\bteacher\b', '\btutor\b',
]
include_overrides = ['\btrainee\b', '\bgraduate\b', '\bfresh\b', '\bjunior\b', '\bentry\b', '\bintern(ship)?\b', '\bnew grad\b']
posted_within_days = 3          # SEARCH window for daily runs (what we ask the job sites for); not a filter
posted_within_days_first_run = 14
max_age_days = 30               # pre-filter: drop only postings older than this

[sources]
jobthai = true  # public commercial/trainee search; bounded independently of JD fetches
gmail = true
linkedin = true
jobsdb = true
companies = true

[jobthai]
keywords = ["management trainee", "key account", "business development"]
max_pages = 1
max_requests = 3  # search budget; host cap leaves room for job descriptions
locations = ["Bangkok", "Nonthaburi", "Samut Prakan", "Pathum Thani"]
title_include = ["key account", "management trainee", "graduate", "business development", "e-commerce", "trade marketing"]

[search]
keywords = [
  "management trainee", "graduate program", "fresh graduate", "key account",
  "trade marketing", "business development", "e-commerce", "strategy analyst",
]
linkedin_locations = ["Bangkok, Thailand", "Singapore"]
jobsdb_locations = ["Bangkok"]
max_pages = 5                   # JobsDB: 30 per page
linkedin_max_pages = 2          # LinkedIn guest: 10 cards per page (start=0,10,20..); kept low to avoid HTTP 429
linkedin_queries = [
  ["management trainee", "Bangkok, Thailand"], ["graduate program", "Bangkok, Thailand"], ["fresh graduate", "Bangkok, Thailand"],
  ["key account", "Bangkok, Thailand"], ["trade marketing", "Bangkok, Thailand"], ["e-commerce", "Bangkok, Thailand"],
  ["management trainee", "Singapore"], ["graduate programme", "Singapore"],
]

[limits]
min_seconds_between_requests = 3
max_requests_per_host_per_run = 40
max_scored_per_run = 80

[limits.per_host]                # overrides for hosts that need more (search pages + JD fetches share the host)
"www.jobthai.com" = 20
"careers.loreal.com" = 20
"www.linkedin.com" = 45          # guest budget is tight: 429 after ~75 req (3 s) on run 1 and after 18 req (8 s) 40 min later
"th.jobsdb.com" = 150

[limits.timeout_per_host]        # seconds; default 20
"api.lever.co" = 60               # Lalamove list is ~1.2 MB; timed out at 20 s on 8 Nov 2026

[limits.delay_per_host]          # seconds between requests, overriding min_seconds_between_requests
"www.linkedin.com" = 8           # first live run (7 Nov 2026) got HTTP 429 after ~75 requests at 3 s

[gmail]
account = "you@example.com"
keychain_service = "jobhunt-gmail"
imap_host = "imap.gmail.com"
alert_from_domains = ["linkedin.com", "jobsdb.com", "seek.com.au"]   # refined from real samples in M2
days_daily = 3
days_first_run = 14


[companies_filter]
keep = ["Thailand", "Bangkok", "Singapore", "Nonthaburi", "Samut Prakan", "Pathum Thani", "Chachoengsao", "Chonburi", "Chon Buri", "Laem Chabang", "Ayutthaya", "Rayong"]

